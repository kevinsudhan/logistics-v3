[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The accounts desk: invoices, proformas, notes, receipts, payments,
  # outstanding, payables and the agent statement, plus the Costs and Invoices
  # sections of a shipment and the Billing section of a case file.
  #
  # It has to be said here. `off` is the default in src/lib/features.ts, and
  # .env.local is gitignored so a deploy never sees it — without this line the
  # deployed build would come up without the desk.
  VITE_ACCOUNTS_DESK = "on"
  # The full case file: Details, Partners & quote, Documents and Billing
  # alongside Mail and Timeline. Anything other than "full" leaves the enquiry
  # as mail and its history only.
  VITE_CASE_FILE = "full"
  # VITE_API_BASE is deliberately NOT set.
  #
  # It used to carry v1's project ref, inherited from v1's own netlify.toml —
  # `wremiarcmppuncgfzrqb`, the production system that shares a Supabase project
  # and a SnapServe account with the live voice agents. v2 reads and writes
  # through Supabase directly; the only thing left using this base is a handful
  # of legacy REST paths in services/backend.ts, and pointing them at v1 means a
  # booking made on this demo changes what a real caller is told.
  #
  # Unset, it falls back to localhost:8787 and fails loudly. That is the correct
  # failure: a deploy that cannot reach a legacy endpoint is a nuisance, and one
  # that quietly writes to production is not.

  # The mock backend stays ON unless a deploy deliberately turns it off, which
  # is the same rule services/backend.ts states: real only when told, because
  # one missing variable should never mean "write to production".
  VITE_MOCK_BACKEND = "on"

# The CRM is a single-page app using client-side routing. Without this, every deep link
# (/shipments/in-process, /knowledge-base) 404s on refresh or when shared, because Netlify
# looks for a file at that path and there isn't one.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed asset filenames change on every build, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
