<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <!-- The mark on the sign-in panel, the start-up screen and the sidebar: fetched with the page, not after it. -->
    <link rel="preload" as="image" href="/media/mark-v1.webp" type="image/webp" fetchpriority="high" />
    <title>ALG CRM</title>

    <!-- Installable: "Add to Home Screen" opens it full screen, like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The installed app's title bar (Windows, Mac) and Android's status bar: the brand navy. -->
    <meta name="theme-color" content="#0F213A" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ALG CRM" />
    <!-- "default": a solid status bar with the app below it, not under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
